# Keeps the Actions cache small. Pull requests only restore caches (ci.yml saves on main), so a closed pull request
# deletes whatever its merge ref still holds, and main keeps only the newest compiler cache per prefix, because the
# cache action saves each run under a new timestamped key.
name: Cache cleanup

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  closed-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the caches of the pull request's merge ref
        run: gh cache delete --all --succeed-on-no-caches --ref "refs/pull/${{ github.event.pull_request.number }}/merge"

  newest-compiler-cache:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete every compiler cache on main but the newest of its prefix
        run: |
          gh cache list --ref refs/heads/main --limit 100 --json id,key,createdAt \
            --jq '[.[] | select(.key | test("^s?ccache-")) | .prefix = (.key | sub("-[0-9]{4}-[0-9]{2}-[0-9]{2}T.*$"; ""))]
                  | group_by(.prefix) | .[] | sort_by(.createdAt) | reverse | .[1:][] | .id' |
            while read -r id; do gh cache delete "$id"; done
